backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:

  # ── EVENTS ──────────────────────────────────────────
  - name: "events"
    label: "Events"
    label_singular: "Event"
    folder: "_data/events"
    create: true
    delete: true
    extension: "yml"
    format: "yml"
    slug: "{{slug}}"
    fields:
      - { label: "Event name", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Time", name: "time", widget: "string", hint: "e.g. 17:00 – 21:00 or TBC" }
      - label: "Event type"
        name: "type"
        widget: "select"
        options: ["Neptunes", "Workshop", "Community", "Social", "Private", "Cooking Class", "Theatre", "Massage", "Blocked"]
      - { label: "Host", name: "host", widget: "string", hint: "Who is running the event?" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Price", name: "price", widget: "string", hint: "e.g. €12 / Free / TBC", required: false }
      - { label: "Max attendees", name: "capacity", widget: "number", required: false }
      - { label: "Featured event?", name: "featured", widget: "boolean", default: false }
      - { label: "Booking link", name: "booking_url", widget: "string", required: false }

  # ── PRICING ─────────────────────────────────────────
  - name: "pricing"
    label: "Pricing"
    files:
      - label: "Space rental rates"
        name: "space_rates"
        file: "_data/pricing/space_rates.yml"
        fields:
          - label: "August intro rates"
            name: "august"
            widget: "object"
            fields:
              - { label: "Community rate (€/hr)", name: "community", widget: "number" }
              - { label: "Commercial rate (€/hr)", name: "commercial", widget: "number" }
          - label: "September onwards"
            name: "september"
            widget: "object"
            fields:
              - { label: "Community rate (€/hr)", name: "community", widget: "number" }
              - { label: "Commercial rate (€/hr)", name: "commercial", widget: "number" }

      - label: "Massage room rates"
        name: "massage_rates"
        file: "_data/pricing/massage_rates.yml"
        fields:
          - { label: "August rate (€/session)", name: "august", widget: "number" }
          - { label: "September rate (€/session)", name: "september", widget: "number" }
          - { label: "Max session length", name: "max_duration", widget: "string", default: "1.5 hours" }

      - label: "Weekly package discount"
        name: "weekly_package"
        file: "_data/pricing/weekly_package.yml"
        fields:
          - { label: "Discount percentage", name: "discount_percent", widget: "number", default: 20 }
          - { label: "Package description", name: "description", widget: "text" }
          - { label: "Cancellation notice (days)", name: "cancellation_days", widget: "number", default: 30 }

  # ── SITE CONTENT ────────────────────────────────────
  - name: "site_content"
    label: "Site content"
    files:
      - label: "Homepage"
        name: "homepage"
        file: "_data/content/homepage.yml"
        fields:
          - { label: "Hero title line 1", name: "hero_title_1", widget: "string" }
          - { label: "Hero title line 2 (italic)", name: "hero_title_2", widget: "string" }
          - { label: "Tagline (Spanish)", name: "tagline_es", widget: "string" }
          - { label: "Tagline (English)", name: "tagline_en", widget: "string" }
          - { label: "Intro strip text", name: "intro_strip", widget: "text" }
          - { label: "Hero photo", name: "hero_image", widget: "image", required: false, hint: "Main photo shown on the homepage hero section" }

      - label: "The Space page"
        name: "space_page"
        file: "_data/content/space.yml"
        fields:
          - { label: "Eyebrow text", name: "eyebrow", widget: "string", hint: "Small text above the title e.g. 'Barcelona · Event Space'" }
          - { label: "Hero title", name: "hero_title", widget: "string" }
          - { label: "Hero description", name: "hero_desc", widget: "text" }
          - { label: "Space size (m²)", name: "size_sqm", widget: "string", hint: "Just the number(s), e.g. 60–100 — 'm²' is added automatically" }
          - { label: "Max capacity", name: "max_capacity", widget: "number", hint: "Just the number — '+' is added automatically" }
          - { label: "Hero photo — Balcony", name: "hero_balcony_image", widget: "image", required: false, hint: "Photo block on the Space page hero" }
          - { label: "Neighbourhood title", name: "neighbourhood_title", widget: "string" }
          - { label: "Neighbourhood", name: "neighbourhood", widget: "string" }
          - { label: "Neighbourhood description", name: "neighbourhood_desc", widget: "text" }
          - { label: "Gallery photo 1 — Main room", name: "gallery_1", widget: "image", required: false }
          - { label: "Gallery photo 2 — Main room", name: "gallery_2", widget: "image", required: false }
          - { label: "Gallery photo 3 — Balcony", name: "gallery_3", widget: "image", required: false }
          - { label: "Gallery photo 4 — Balcony", name: "gallery_4", widget: "image", required: false }
          - { label: "Gallery photo 5 — Detail / other", name: "gallery_5", widget: "image", required: false }

      - label: "About page"
        name: "about_page"
        file: "_data/content/about.yml"
        fields:
          - { label: "Hero title", name: "hero_title", widget: "string" }
          - { label: "Bio paragraph 1", name: "bio_1", widget: "text" }
          - { label: "Bio paragraph 2", name: "bio_2", widget: "text" }
          - { label: "Pull quote", name: "quote", widget: "text" }
          - { label: "Neptunes description 1", name: "neptunes_1", widget: "text" }
          - { label: "Neptunes description 2", name: "neptunes_2", widget: "text" }
          - { label: "Photographer bio", name: "photographer_bio", widget: "text" }
          - { label: "Hero — Alexa photo (top right)", name: "alexa_image", widget: "image", required: false, hint: "Small photo top right of hero section" }
          - { label: "Hero — Barcelona/space photo", name: "barcelona_image", widget: "image", required: false, hint: "Second small photo in hero section" }
          - { label: "Alexa portrait (main bio section)", name: "alexa_portrait", widget: "image", required: false, hint: "Large portrait in the founder section" }
          - { label: "Photographer photo", name: "photographer_image", widget: "image", required: false }

      - label: "Rent page"
        name: "rent_page"
        file: "_data/content/rent.yml"
        fields:
          - { label: "Hero title", name: "hero_title", widget: "string" }
          - { label: "Hero description", name: "hero_desc", widget: "text" }
          - { label: "Hero photo — Event setup", name: "hero_event_setup_image", widget: "image", required: false }
          - { label: "Hero photo — Balcony", name: "hero_balcony_image", widget: "image", required: false }

      - label: "Membership page"
        name: "membership_page"
        file: "_data/content/membership.yml"
        fields:
          - { label: "Hero title", name: "hero_title", widget: "string" }
          - { label: "Hero description", name: "hero_desc", widget: "text" }

          - label: "── Amigo/a tier ──"
            name: "amigo_heading"
            widget: "hidden"
            default: ""
          - { label: "Amigo/a — price (€/month)", name: "amigo_price", widget: "number" }
          - { label: "Amigo/a — short description", name: "amigo_desc", widget: "text" }
          - { label: "Amigo/a — feature 1", name: "amigo_feature_1", widget: "string", required: false }
          - { label: "Amigo/a — feature 2", name: "amigo_feature_2", widget: "string", required: false }
          - { label: "Amigo/a — feature 3", name: "amigo_feature_3", widget: "string", required: false }

          - label: "── Vecino/a tier ──"
            name: "vecino_heading"
            widget: "hidden"
            default: ""
          - { label: "Vecino/a — price (€/month)", name: "vecino_price", widget: "number" }
          - { label: "Vecino/a — short description", name: "vecino_desc", widget: "text" }
          - { label: "Vecino/a — feature 1", name: "vecino_feature_1", widget: "string", required: false }
          - { label: "Vecino/a — feature 2", name: "vecino_feature_2", widget: "string", required: false }
          - { label: "Vecino/a — feature 3", name: "vecino_feature_3", widget: "string", required: false }
          - { label: "Vecino/a — feature 4", name: "vecino_feature_4", widget: "string", required: false }
          - { label: "Vecino/a — photo/video perk title", name: "vecino_camera_title", widget: "string", required: false }
          - { label: "Vecino/a — photo/video perk description", name: "vecino_camera_text", widget: "string", required: false }

          - label: "── Residente tier ──"
            name: "residente_heading"
            widget: "hidden"
            default: ""
          - { label: "Residente — price (€/month)", name: "residente_price", widget: "number" }
          - { label: "Residente — short description", name: "residente_desc", widget: "text" }
          - { label: "Residente — feature 1", name: "residente_feature_1", widget: "string", required: false }
          - { label: "Residente — feature 2", name: "residente_feature_2", widget: "string", required: false }
          - { label: "Residente — feature 3", name: "residente_feature_3", widget: "string", required: false }
          - { label: "Residente — feature 4", name: "residente_feature_4", widget: "string", required: false }
          - { label: "Residente — photo/video perk title", name: "residente_camera_title", widget: "string", required: false }
          - { label: "Residente — photo/video perk description", name: "residente_camera_text", widget: "string", required: false }

          - label: "── Comparison table ──"
            name: "compare_heading"
            widget: "hidden"
            default: ""
          - { label: "Comparison hint", name: "compare_hint", widget: "hidden", default: "For each column below: type 'yes' for a checkmark, 'no' for a dash, or free text like '3 hrs'" }
          - { label: "Row 1 — label", name: "compare_1_label", widget: "string" }
          - { label: "Row 1 — Amigo/a", name: "compare_1_amigo", widget: "string" }
          - { label: "Row 1 — Vecino/a", name: "compare_1_vecino", widget: "string" }
          - { label: "Row 1 — Residente", name: "compare_1_residente", widget: "string" }
          - { label: "Row 2 — label", name: "compare_2_label", widget: "string" }
          - { label: "Row 2 — Amigo/a", name: "compare_2_amigo", widget: "string" }
          - { label: "Row 2 — Vecino/a", name: "compare_2_vecino", widget: "string" }
          - { label: "Row 2 — Residente", name: "compare_2_residente", widget: "string" }
          - { label: "Row 3 — label", name: "compare_3_label", widget: "string" }
          - { label: "Row 3 — Amigo/a", name: "compare_3_amigo", widget: "string" }
          - { label: "Row 3 — Vecino/a", name: "compare_3_vecino", widget: "string" }
          - { label: "Row 3 — Residente", name: "compare_3_residente", widget: "string" }
          - { label: "Row 4 — label", name: "compare_4_label", widget: "string" }
          - { label: "Row 4 — Amigo/a", name: "compare_4_amigo", widget: "string" }
          - { label: "Row 4 — Vecino/a", name: "compare_4_vecino", widget: "string" }
          - { label: "Row 4 — Residente", name: "compare_4_residente", widget: "string" }
          - { label: "Row 5 — label", name: "compare_5_label", widget: "string" }
          - { label: "Row 5 — Amigo/a", name: "compare_5_amigo", widget: "string" }
          - { label: "Row 5 — Vecino/a", name: "compare_5_vecino", widget: "string" }
          - { label: "Row 5 — Residente", name: "compare_5_residente", widget: "string" }
          - { label: "Row 6 — label", name: "compare_6_label", widget: "string" }
          - { label: "Row 6 — Amigo/a", name: "compare_6_amigo", widget: "string" }
          - { label: "Row 6 — Vecino/a", name: "compare_6_vecino", widget: "string" }
          - { label: "Row 6 — Residente", name: "compare_6_residente", widget: "string" }

      - label: "Contact page"
        name: "contact_page"
        file: "_data/content/contact_page.yml"
        fields:
          - { label: "Hero title", name: "hero_title", widget: "string" }
          - { label: "Intro text", name: "intro_desc", widget: "text" }
          - { label: "Response time note", name: "response_note", widget: "string", hint: "e.g. We reply within 24-48 hours" }

  # ── CATS ────────────────────────────────────────────
  - name: "cats"
    label: "The cats"
    files:
      - label: "Yuki"
        name: "yuki"
        file: "_data/cats/yuki.yml"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Homepage role", name: "role_home", widget: "string", hint: "Short tagline shown on homepage card" }
          - { label: "Homepage bio", name: "bio_home", widget: "text", hint: "Short bio for homepage cat card" }
          - { label: "Homepage photo", name: "image_home", widget: "image", required: false }
          - { label: "About page role", name: "role_about", widget: "string", hint: "Role shown on about page" }
          - { label: "About page bio", name: "bio_about", widget: "text", hint: "Full bio for about page" }
          - { label: "Fun note", name: "note", widget: "string" }
          - { label: "About page photo", name: "image_about", widget: "image", required: false }

      - label: "Thelma"
        name: "thelma"
        file: "_data/cats/thelma.yml"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Homepage role", name: "role_home", widget: "string" }
          - { label: "Homepage bio", name: "bio_home", widget: "text" }
          - { label: "Homepage photo", name: "image_home", widget: "image", required: false }
          - { label: "About page role", name: "role_about", widget: "string" }
          - { label: "About page bio", name: "bio_about", widget: "text" }
          - { label: "Warning note", name: "warning", widget: "string" }
          - { label: "About page photo", name: "image_about", widget: "image", required: false }

      - label: "Louise"
        name: "louise"
        file: "_data/cats/louise.yml"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Homepage role", name: "role_home", widget: "string" }
          - { label: "Homepage bio", name: "bio_home", widget: "text" }
          - { label: "Homepage photo", name: "image_home", widget: "image", required: false }
          - { label: "About page role", name: "role_about", widget: "string" }
          - { label: "About page bio", name: "bio_about", widget: "text" }
          - { label: "Fun note", name: "note", widget: "string" }
          - { label: "About page photo", name: "image_about", widget: "image", required: false }

  # ── CONTACT ─────────────────────────────────────────
  - name: "contact"
    label: "Contact & social"
    files:
      - label: "Contact details"
        name: "contact_details"
        file: "_data/content/contact.yml"
        fields:
          - { label: "Email address", name: "email", widget: "string" }
          - { label: "Instagram handle", name: "instagram", widget: "string" }
          - { label: "Neptune's Instagram", name: "neptunes_instagram", widget: "string" }
          - { label: "Response time note", name: "response_time", widget: "string" }
          - { label: "Neighbourhood name", name: "neighbourhood", widget: "string" }

  # ── COLOURS ─────────────────────────────────────────
  - name: "colours"
    label: "🎨 Colours"
    files:
      - label: "Site colour palette"
        name: "palette"
        file: "_data/colours.yml"
        fields:

          - label: "── Backgrounds ──"
            name: "bg_heading"
            widget: "hidden"
            default: ""

          - label: "Page background"
            name: "bg"
            widget: "color"
            default: "#F5F1E6"
            hint: "Main page background — currently warm off-white"

          - label: "Surface / cards"
            name: "surface"
            widget: "color"
            default: "#EAE3D0"
            hint: "Card backgrounds, hero panels"

          - label: "── Brand — Olive Green ──"
            name: "green_heading"
            widget: "hidden"
            default: ""

          - label: "Olive dark"
            name: "sage_dark"
            widget: "color"
            default: "#4A5235"
            hint: "Hover states, deep sections"

          - label: "Olive (primary)"
            name: "sage"
            widget: "color"
            default: "#65704A"
            hint: "Nav active, eyebrows, CTA section backgrounds"

          - label: "Olive light"
            name: "sage_light"
            widget: "color"
            default: "#8A9668"
            hint: "Secondary buttons, borders"

          - label: "Olive tint"
            name: "sage_tint"
            widget: "color"
            default: "#B8C4A0"
            hint: "Subtext on dark/olive backgrounds"

          - label: "Olive pale"
            name: "sage_pale"
            widget: "color"
            default: "#DDE3D0"
            hint: "Card photo backgrounds, section tints"

          - label: "── Brand — Brick Red ──"
            name: "brick_heading"
            widget: "hidden"
            default: ""

          - label: "Brick deep"
            name: "terracotta_deep"
            widget: "color"
            default: "#6B2018"
            hint: "Hover states on brick elements"

          - label: "Brick (secondary)"
            name: "terracotta"
            widget: "color"
            default: "#9A4C34"
            hint: "Headers, logo accent, dividers, section headings"

          - label: "Brick light"
            name: "terracotta_light"
            widget: "color"
            default: "#C47058"
            hint: "Highlights, featured tags"

          - label: "Brick pale"
            name: "terracotta_pale"
            widget: "color"
            default: "#F0D8D0"
            hint: "Card backgrounds, section tints"

          - label: "── Brand — Deep Red (CTAs) ──"
            name: "red_heading"
            widget: "hidden"
            default: ""

          - label: "Accent deep"
            name: "accent_deep"
            widget: "color"
            default: "#5C1010"
            hint: "CTA hover states"

          - label: "Accent / CTA"
            name: "accent"
            widget: "color"
            default: "#8B1E1E"
            hint: "Book now button, primary CTAs — most important accent"

          - label: "Accent light"
            name: "accent_light"
            widget: "color"
            default: "#B84040"
            hint: "Accent highlights"

          - label: "── Warm Highlights ──"
            name: "warm_heading"
            widget: "hidden"
            default: ""

          - label: "Ochre / highlight"
            name: "ochre_pale"
            widget: "color"
            default: "#E8D9A0"
            hint: "Pale yellow — italic highlights on dark backgrounds, used sparingly"

          - label: "Pink accent"
            name: "pink"
            widget: "color"
            default: "#D4A0A0"
            hint: "Small accent pops only — not used as backgrounds"

          - label: "── Text & Structure ──"
            name: "text_heading"
            widget: "hidden"
            default: ""

          - label: "Text primary"
            name: "bark"
            widget: "color"
            default: "#2B2B28"
            hint: "Headings, footer, dark section backgrounds"

          - label: "Text secondary"
            name: "bark_light"
            widget: "color"
            default: "#4A4A44"
            hint: "Body text, labels"

          - label: "Text muted"
            name: "text_muted"
            widget: "color"
            default: "#6B6B62"
            hint: "Descriptions, captions"

          - label: "Text light"
            name: "text_light"
            widget: "color"
            default: "#9A9A90"
            hint: "Dates, metadata"

          - label: "Border"
            name: "border"
            widget: "color"
            default: "#D8CFB8"
            hint: "All borders and dividers"

          - label: "── Neptunes Brand ──"
            name: "neptunes_heading"
            widget: "hidden"
            default: ""

          - label: "Neptune deep (navy)"
            name: "neptunes"
            widget: "color"
            default: "#2D3B6B"
            hint: "Neptunes dark section backgrounds"

          - label: "Neptune mid (blue)"
            name: "neptunes_mid"
            widget: "color"
            default: "#4A5C96"
            hint: "Neptunes tags and badges"

          - label: "Neptune light (sky)"
            name: "neptunes_light"
            widget: "color"
            default: "#8FA3D4"
            hint: "Neptunes section backgrounds"

          - label: "Neptune purple"
            name: "neptunes_purple"
            widget: "color"
            default: "#6B5A9E"
            hint: "Neptunes accent colour"

          - label: "Herb deep (dark green)"
            name: "herb_deep"
            widget: "color"
            default: "#1E4D3A"
            hint: "About page hero background"

          - label: "Herb (mid green)"
            name: "herb"
            widget: "color"
            default: "#2E7D5A"
            hint: "Plant medicine sections"

          - label: "Herb light"
            name: "herb_light"
            widget: "color"
            default: "#6DB89A"
            hint: "Labels on dark herb backgrounds"

  # ── GALLERY ─────────────────────────────────────────
  - name: "gallery"
    label: "📸 Gallery"
    label_singular: "Photo"
    folder: "_data/gallery"
    create: true
    delete: true
    extension: "yml"
    format: "yml"
    slug: "{{slug}}"
    fields:
      - { label: "Title / caption", name: "title", widget: "string" }
      - { label: "Photo", name: "image", widget: "image" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Space", "Events", "Cats"]
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, required: false }
      - { label: "Featured?", name: "featured", widget: "boolean", default: false }
