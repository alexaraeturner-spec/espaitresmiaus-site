name: Thelma
role: Resident beauty, keeping her distance
bio: Brown ombré coat, blue eyes, absolutely stunning - and she knows it. Thelma
  prefers to admire gatherings from afar. Please don't approach or touch her;
  she'll come to you if and when she's ready.
warning: If you stare, she runs away
