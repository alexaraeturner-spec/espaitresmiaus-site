bio_about: Gloriously fluffy and entirely self-directed — Yuki does exactly what
  she wants, when she wants, at whatever pace suits her. She won't come to you.
  But if she likes you, she'll simply appear beside you one day, without
  announcement.
note: ✦ If Yuki sits near you, you've passed a test you didn't know you were taking.
