hero_title: A space grown from roots & ritual
bio_1: >+
  
  Tres Miaus started as a need — for a home, for a practice, for a place where community could gather around plants, magic, and making things by hand. The cats came with the deal.

bio_2: >-
  Hi, I'm Alexa

  I'm an aspiring herbalist, witch, and maker — drawn to the intersection of plant medicine, magic, and craft. I make and sell herbal creations, magical and medicinal, and I've spent the past few years building a practice around the plants, rituals, and community that make life feel more rooted.


  Tres Miaus is the physical home for all of that. A space where I live, practice, and host — and where other people can bring their own work, their own community, their own rituals.


  The three cats were non-negotiable. Yuki, Thelma, and Louise have been part of the practice since the beginning. They'll be here when you arrive, and probably watching when you leave.
quote: '"I wanted a space that felt like something — warm, alive, full of plants
  and cats and the kind of people who make things and gather on purpose."'
neptunes_1: >-
  Before Tres Miaus, there was Neptune's Herbal Lab — a community practice built
  around herbalism, magic, and arts and crafts. Events, workshops, and handmade
  herbal creations, all rooted in the belief that plant medicine and ritual
  belong in everyday life.


  Tres Miaus is where Neptune's Herbal Lab found its permanent home. The space was built to host the kind of events that Neptune's has always run — intimate, hands-on, grounded in the natural world — and to offer that same space to others who want to gather with intention.
neptunes_2: >-
  🌿

  Plant medicine & herbalism

  Workshops, monographs, and hands-on practice with medicinal plants

  🌙

  Moon rituals & ceremony

  New and full moon gatherings, seasonal ceremonies, and intention setting

  🕯️

  Craft & making

  Candle making, incense blending, and the slow art of making things by hand

  🪴

  Ayurveda & traditional wisdom

  Seasonal practice, plant intelligence, and the knowledge that's been passed down
photographer_bio: >-
  Every event at Tres Miaus has the option of being documented — beautifully,
  naturally, in the spirit of the space. Our resident photographer attends
  events and captures the moments that make each gathering worth remembering.


  Her name and full details coming soon — in the meantime, photo and video coverage can be added to any booking. All fees go directly to her.


  Event photography — candid and atmospheric

  Short-form video and Instagram reels

  Available for events up to a full day

  Discounted rates for Vecino/a and Residente members
